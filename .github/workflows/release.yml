# Publish Windows and macOS binaries to a GitHub Release when a v* tag is pushed.
#
#   git tag v0.1.0
#   git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: build product binaries
        run: make build-all VERSION=${GITHUB_REF_NAME}
      - name: checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
          body: |
            Tab Router **${{ github.ref_name }}** — two isolated Chromium windows, each with its own profile and public IP.

            You do **not** need Go. You do **not** need an account. You do **not** need a `routes.toml` file.

            Open Terminal (Mac) or PowerShell (Windows). Download, then start:

            ### Mac (Apple chip — M1, M2, M3, M4)

            Open Terminal, paste this, press Enter:

            ```
            mkdir -p ~/tab-router-app
            cd ~/tab-router-app
            curl -L -o tab-router https://github.com/Nareik33L/tab-router/releases/latest/download/tab-router-mac-apple-silicon
            chmod +x tab-router
            xattr -c tab-router 2>/dev/null
            ./tab-router --identities 2 --url https://example.com
            ```

            Apple menu → About This Mac: if you see **Processor** (Intel) instead of **Chip**, download `tab-router-mac-intel` in the `curl` line.

            ### Windows

            Open PowerShell, paste this:

            ```
            New-Item -ItemType Directory -Force -Path $HOME\tab-router-app | Out-Null
            cd $HOME\tab-router-app
            Invoke-WebRequest -Uri https://github.com/Nareik33L/tab-router/releases/latest/download/tab-router-windows.exe -OutFile tab-router.exe
            .\tab-router.exe --identities 2 --url https://example.com
            ```

            If SmartScreen appears: More info → Run anyway.

            The first start downloads Chromium and a local Tor exit helper. Versioned files (`tab-router-v…-darwin-arm64` and so on) are also attached.
