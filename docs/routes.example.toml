# Tab Router upstream routes (optional power-user override)

Normal startup does not use this file. Just run
`tab-router --identities 2 --url https://example.com`.

Keep this file private (chmod 600 / owner-only ACL) if you do create it.
Never commit it.

[[route]]
id = "route-001"
type = "socks5"                      # socks5 | http | wireguard
address = "proxy-a.example.net:1080"
username = "alice"
password_env = "TR_ROUTE_001_PASSWORD"   # or: password = "..."

[[route]]
id = "route-002"
type = "http"
address = "proxy-b.example.net:3128"
