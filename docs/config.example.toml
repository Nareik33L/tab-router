# Tab Router configuration (non-secret).
# Startup asks for the Decodo proxy username and password.
# DECODO_USERNAME and DECODO_PASSWORD skip that prompt.
# An explicit --routes file overrides Decodo for tests.
identities = 2
startup_url = ""
persistent_identities = true
fail_closed = true
ipv6 = true
headless = false

[verify]
ip_echo_url = "https://api.ipify.org?format=json"
ipv6_echo_url = "https://api6.ipify.org?format=json"
compare_host_ip = true
timeout_seconds = 20

[health]
probe_interval_seconds = 10
ip_check_interval_seconds = 60

# Optional Decodo gateway settings. Startup uses Decodo either way.
# Country is optional. Session length defaults to 1440 minutes.
# [routing]
# country = "gb"
# session_minutes = 1440
# host = "gate.decodo.com"
# port = 7000

# Defaults for identities created from now on. Empty = detect from host once.
[environment]
locale = ""
timezone = ""
window = "1280x860"
device_scale_factor = 1.0
color_scheme = "light"

# Per-identity overrides, applied only when that identity is first created.
# [[identity]]
# index = 2
# locale = "de-DE"
# timezone = "Europe/Berlin"
