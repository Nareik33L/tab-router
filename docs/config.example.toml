# Tab Router configuration (non-secret).
# Network routes are provisioned automatically on start. No login required.
# Power users may still drop a routes.toml next to this file.
identities = 2
startup_url = ""
persistent_identities = true
fail_closed = true
ipv6 = true
headless = false

[verify]
ip_echo_url = "https://api.ipify.org?format=json"
ipv6_echo_url = "https://api6.ipify.org?format=json"
compare_host_ip = true
timeout_seconds = 20

[health]
probe_interval_seconds = 10
ip_check_interval_seconds = 60

# Leave provider empty for local Tor exits (no account).
# "decodo" requires an activation server, or DECODO_USERNAME and
# DECODO_PASSWORD in the environment for local development.
# A Decodo failure does not fall back to Tor.
# [routing]
# provider = "decodo"
# country = "gb"
# session_minutes = 1440
#
# [activation]
# server = "https://activation.example.com"

# Defaults for identities created from now on. Empty = detect from host once.
[environment]
locale = ""
timezone = ""
window = "1280x860"
device_scale_factor = 1.0
color_scheme = "light"

# Per-identity overrides, applied only when that identity is first created.
# [[identity]]
# index = 2
# locale = "de-DE"
# timezone = "Europe/Berlin"
